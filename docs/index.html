  <script>
    // Runs before first paint, on purpose, and inline on purpose. Anything
    // deferred to a module — even the one that owns this preference — arrives
    // after the browser has already painted, so a reader who chose dark gets a
    // full-page flash of white on every single navigation. That flash is the
    // reason this duplicates three lines of theme.js rather than importing it.
    try {
      var m = localStorage.getItem('enchiridion:theme');
      if (m !== 'light' && m !== 'dark') {
        m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = m;
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
